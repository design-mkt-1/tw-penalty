<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040412">
<title data-i18n="title">Top Win — Заб’єш пенальті та виграєш!</title>

<!-- The brand's square mark, the same file on every Top Win landing. Not
     logo-topwin.svg, which is 247x44 of horizontal type and a smear at 16px.
     Without this line a browser asks for /favicon.ico, which this repo does
     not have and the deploy allowlist would not publish anyway: a 404 in the
     console of every visit, inherited from the landing this was ported from. -->
<link rel="icon" href="assets/img/favicon_topwin.svg" type="image/svg+xml">

<!-- The LCP image and the faces the first paint needs are all discovered late:
     the plate only after campaign/main.css parses, a font only after that
     stylesheet is applied to text. Named here, they start with the
     stylesheets instead.

     Two subsets, not one, and not because the default language changed to UA:
     the first paint genuinely draws both scripts. The tagline over the goal is
     Cyrillic; the six targets on the goal are latin -- x12, x3, x2 -- and so
     is the apostrophe in Заб’єш, which the Cyrillic range stops short of.
     Preloading only the language's own subset would leave the multipliers
     swapping in after the pitch. The remaining four woff2, the two latin-ext
     and the italic cuts, stay deferred: the italics live in the card, which is
     hidden until a goal is scored. -->
<link rel="preload" as="image" type="image/webp" href="assets/img/pitch-spot.webp">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/roboto-cyrillic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/roboto-latin.woff2" crossorigin>

<!-- Reset, tokens, the shell, the card, the page shape, then the mechanic.
     The first five are tw-lp-template's and are never edited here; campaign/main.css
     campaign/main.css is this campaign's and comes last so it wins where the
     two ever meet. -->
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/form.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="campaign/main.css">
</head>
<body>

<!-- js/shell.js replaces these two markers with the header and the footer
     every Top Win landing shares, and appends the registration <dialog> to
     <body>. css/stage.css makes the three of them a column that never
     scrolls, with #tw-main taking whatever the two bars leave. -->
<div data-tw="header"></div>

<main id="tw-main">

  <!-- ── call to action ─────────────────────────────────────── -->
  <div class="tagline">
    <!-- The scripts are deferred, so this text is what the first paint
         shows. It has to be the default language's, or the tagline flashes
         English on a Ukrainian page. -->
    <h1 class="tagline__text" data-i18n="tagline">Заб’єш пенальті<br>та виграєш!</h1>
  </div>

  <!-- ── pitch ──────────────────────────────────────────────── -->
  <div class="pitch">
    <!-- The goal is painted into the stadium plate, so this element draws
         nothing: it is the geometry the panels, the keeper and the effects
         are hung on, sized and placed to land exactly on the painted posts.
         See the numbers in campaign/main.css. -->
    <div class="goal">
      <div class="panels" role="group" data-i18n-attr="aria-label:goal.aim">
        <button class="panel" type="button" data-cell="tl" data-mult="12"><span>×12</span></button>
        <button class="panel" type="button" data-cell="tc" data-mult="3"><span>×3</span></button>
        <button class="panel" type="button" data-cell="tr" data-mult="12"><span>×12</span></button>
        <button class="panel" type="button" data-cell="bl" data-mult="2"><span>×2</span></button>
        <button class="panel" type="button" data-cell="bc" data-mult="3"><span>×3</span></button>
        <button class="panel" type="button" data-cell="br" data-mult="2"><span>×2</span></button>
      </div>

      <div class="dust" aria-hidden="true"></div>
      <div class="keeper-shadow" aria-hidden="true"></div>
      <div class="keeper" data-pose="idle" role="presentation"></div>
      <div class="hit" aria-hidden="true"></div>
    </div>

    <!-- ── transient message ────────────────────────────────── -->
    <!-- Inside the pitch, not the stage: it is placed against the goal
         line, and only in here does --goal-base mean anything. -->
    <p class="msg" role="status" aria-live="polite" hidden></p>
  </div>

  <!-- ── ball ───────────────────────────────────────────────── -->
  <div class="ball-zone">
    <button class="ball" type="button" data-i18n-attr="aria-label:ball.shoot"></button>
  </div>

  <!-- The ball in flight, its shadow, the net and the confetti. Inside
       #tw-main because css/stage.css gives the mechanic the whole box and
       anything hung off <body> instead would take a flex row of its own. -->
  <canvas class="fx" aria-hidden="true"></canvas>

</main>

<div data-tw="footer"></div>

<!-- defer, and the order IS the dependency graph: no bundler, no imports.
     campaign.js first because everything reads it; then the shell's five;
     then this campaign's mechanic, which reaches the card through the one
     seam it is allowed, TW.openForm(). -->
<script defer src="campaign.js"></script>
<script defer src="js/strings.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/form.js"></script>
<script defer src="js/audio.js"></script>
<script defer src="js/shell.js"></script>
<script defer src="campaign/stage.js"></script>
<script defer src="campaign/animator.js"></script>
<script defer src="campaign/fx.js"></script>
<script defer src="campaign/main.js"></script>
</body>
</html>
